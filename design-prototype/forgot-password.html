<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Passwort vergessen — Velofreundliches Wetzikon Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/admin.css">
</head>
<body>

<div class="adm-auth">
  <aside class="adm-auth__side">
    <div class="adm-auth__side-top">
      <a href="login.html" class="vw-logo" style="pointer-events:none;">
        <span class="vw-logo__bar"></span>
        <span class="vw-logo__text">
          <span class="vw-logo__top">velofreundliches</span>
          <span class="vw-logo__bottom">WETZIKON</span>
        </span>
      </a>
    </div>
  </aside>

  <div class="adm-auth__main">
    <div class="adm-auth__card">
      <div class="adm-auth__logo-mobile">
        <a href="login.html" class="vw-logo" style="pointer-events:none;">
          <span class="vw-logo__bar"></span>
          <span class="vw-logo__text">
            <span class="vw-logo__top">velofreundliches</span>
            <span class="vw-logo__bottom">WETZIKON</span>
          </span>
        </a>
      </div>

      <a href="login.html" class="adm-auth__back"><i data-lucide="arrow-left" width="14" height="14"></i> Zurück zur Anmeldung</a>

      <span class="adm-auth__eyebrow">Admin-Bereich</span>
      <h1 class="adm-auth__title">Passwort vergessen</h1>

      <form id="forgotForm" novalidate>
        <div class="adm-field">
          <label class="adm-label" for="email">E-Mail-Adresse <span class="adm-required">*</span></label>
          <input type="email" id="email" name="email" autocomplete="username" placeholder="vorname.nachname@velofreundliches-wetzikon.ch" required>
        </div>
        <button type="submit" class="adm-btn adm-btn--primary adm-btn--block">
          Code anfordern <i data-lucide="mail" width="16" height="16"></i>
        </button>
      </form>
    </div>
  </div>
</div>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  if (typeof lucide !== 'undefined') lucide.createIcons();
  var form = document.getElementById('forgotForm');
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    // Prototype only: a real implementation responds identically whether or not the email
    // address exists (avoids leaking which addresses are valid), then emails the code if it does.
    window.location.href = 'verify.html?flow=reset';
  });
});
</script>
</body>
</html>
