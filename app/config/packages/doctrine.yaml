doctrine:
    dbal:
        # Deliberately not `resolve:DATABASE_URL` -- that processor re-scans the env var's own
        # value for %...% and substitutes them as container parameters (for composing a DSN out
        # of other parameters, e.g. %database_host%). Nothing here does that -- every .env.local
        # is one self-contained, already-complete DSN -- and the plain `env()` form below is
        # actively required once a DB password needs percent-encoding (any of : / ? # [ ] @ ! $
        # & ' ( ) * + , ; = in it, see RFC 3986): `resolve:` was crashing with "non-existent
        # parameter" on production/testing's password (e.g. ...Tp%21V%2A... from `!`/`*`) because
        # it read the literal substring between two `%` as a parameter name to look up.
        url: '%env(DATABASE_URL)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
