# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    # Cookie name/flags match api/openapi.yaml's sessionAuth securityScheme
    # (vw_admin_session, httpOnly, SameSite=Strict). cookie_secure is left at its "auto" default
    # (Secure only over HTTPS) since local dev here runs over plain HTTP.
    session:
        name: vw_admin_session
        cookie_httponly: true
        cookie_samesite: strict

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
